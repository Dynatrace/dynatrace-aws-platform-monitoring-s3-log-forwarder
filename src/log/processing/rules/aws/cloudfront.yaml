name: cloudfront

# Standard logging (legacy / v1) to S3.
# File Name format:  <optional prefix>/<distribution ID>.YYYY-MM-DD-HH.unique-ID.gz
# File Name examples:
#     example/E1SFLUZKKLSP61.2023-02-16-14.e519cdee.gz
#  cloudfront/EI40887JFNMEK.2026-05-27-08.b7c58fd5.gz
# The negative lookahead excludes standard logging (v2) paths which arrive under
# AWSLogs/<account-id>/CloudFront/ (handled by cloudfront-v2.yaml).
known_key_path_pattern: '^(?!.*{aws_logs_prefix}/(aws-account-id=)?{aws_account_id_pattern}/CloudFront/).*?{cloudfront_distribution_id_pattern}\.{year_pattern}-{month_pattern}-{day_pattern}-{hour_pattern}\.[a-fA-F0-9]{{8}}\.gz$'

source: aws

log_format: text

annotations:
  cloud.provider: aws
  aws.region: global
  aws.resource.type: "AWS::CloudFront::Distribution"

attribute_extraction_grok_expression: "%{CLOUDFRONTTIMESTAMP:timestamp_to_transform}"

# Skip any leading lines that begin with '#' (the #Version and #Fields header lines).
header_line_prefix: '#'
