name: cloudfront-v2

# CloudFront standard logging (v2) delivered to S3 via CloudWatch vended logs.
# Only the plain-text / W3C output format is supported (JSON and Parquet are out of scope).
#
# Default delivery paths (no user-specified bucket prefix):
#   AWSLogs/<account-id>/CloudFront/[<suffix-path>/]<file>.gz
#   AWSLogs/aws-account-id=<account-id>/CloudFront/[<suffix-path>/]<file>.gz  (Hive-compatible)
#
# Example keys:
#   AWSLogs/012345678910/CloudFront/E1SFLUZKKLSP61.2025-09-23-08.abcdef01.gz
#   AWSLogs/aws-account-id=012345678910/CloudFront/myFolder/2025/09/23/E1SFLUZKKLSP61.2025-09-23-08.abcdef01.gz
#
# Note: when a user specifies a custom bucket prefix the AWSLogs segment is absent;
# such files fall back to the cloudfront (v1/legacy) rule.
#
# Rules are selected by key alone, so the only way to keep unsupported output
# formats out of this text rule is to exclude their extensions here. JSON
# deliveries land as '.json.gz' and are rejected by the lookbehind; Parquet
# ('.parquet') is already excluded by the '.gz' suffix. Both then fall through
# to generic processing rather than being mis-parsed as W3C text.
known_key_path_pattern: '^.*?{aws_logs_prefix}/(aws-account-id=)?{aws_account_id_pattern}/CloudFront/.*(?<!\.json)\.gz$'

source: aws

log_format: text

annotations:
  cloud.provider: aws
  aws.region: global
  aws.resource.type: "AWS::CloudFront::Distribution"
  # CloudFront ARNs have no region component.
  aws.arn.pattern: "arn:aws:cloudfront::{aws.account.id}:distribution/{__cloudfront.distribution.id}"

attribute_extraction_from_key_name:
  # Extract the AWS account ID from the path segment before /CloudFront/.
  # re.search returns the account-id portion; the lookahead (?=/CloudFront/) is
  # not consumed, so attrib.group() yields just the 12-digit account number.
  aws.account.id: '{aws_account_id_pattern}(?=/CloudFront/)'
  # The distribution ID is not guaranteed a fixed position: it appears in the
  # file name (E1SFLUZKKLSP61.2025-09-23-08.abcdef01.gz) and, when the customer
  # partitions with {DistributionId}, as its own path segment. Match it anywhere,
  # requiring a non-alphanumeric boundary on both sides so it cannot match inside
  # a longer token. Lowercase counts as a boundary character: without it a custom
  # suffix path such as 'folderE1SFLUZKKLSP61part' would yield a bogus ARN.
  # If it is absent entirely, aws.arn.pattern is left unresolved and dropped.
  __cloudfront.distribution.id: '(?<![A-Za-z0-9]){cloudfront_distribution_id_pattern}(?![A-Za-z0-9])'

attribute_extraction_grok_expression: "%{CLOUDFRONTTIMESTAMP:__timestamp_to_transform}"

# The W3C output format starts with one or more '#'-prefixed header lines
# (e.g. "#Fields: date time ...").  The plain output format has none.
# header_line_prefix handles both cases: leading '#' lines are skipped and
# skipping stops at the first data line.
header_line_prefix: '#'