name: cloudfront-v2

# CloudFront standard logging (v2) delivered to S3 via CloudWatch vended logs.
# Only the plain-text / W3C output format is supported (JSON and Parquet are out of scope).
#
# Default delivery paths (no user-specified bucket prefix):
#   AWSLogs/<account-id>/CloudFront/[<suffix-path>/]<file>.gz
#   AWSLogs/aws-account-id=<account-id>/CloudFront/[<suffix-path>/]<file>.gz  (Hive-compatible)
#
# Example keys:
#   AWSLogs/012345678910/CloudFront/E1SFLUZKKLSP61.2025-09-23-08.abcdef01.gz
#   AWSLogs/aws-account-id=012345678910/CloudFront/myFolder/2025/09/23/E1SFLUZKKLSP61.2025-09-23-08.abcdef01.gz
#
# Note: when a user specifies a custom bucket prefix the AWSLogs segment is absent;
# such files fall back to the cloudfront (v1/legacy) rule.
known_key_path_pattern: '^.*?{aws_logs_prefix}/(aws-account-id=)?{aws_account_id_pattern}/CloudFront/.*\.gz$'

source: aws

log_format: text

annotations:
  cloud.provider: aws
  aws.region: global
  aws.resource.type: "AWS::CloudFront::Distribution"
  # CloudFront ARNs have no region component.
  aws.arn.pattern: "arn:aws:cloudfront::{aws.account.id}:distribution/{cloudfront.distribution.id}"

attribute_extraction_from_key_name:
  # Extract the AWS account ID from the path segment before /CloudFront/.
  # re.search returns the account-id portion; the lookahead (?=/CloudFront/) is
  # not consumed, so attrib.group() yields just the 12-digit account number.
  aws.account.id: '{aws_account_id_pattern}(?=/CloudFront/)'
  # Extract the distribution ID from the filename (e.g. E1SFLUZKKLSP61 in
  # E1SFLUZKKLSP61.2025-09-23-08.abcdef01.gz); the lookahead anchors it to the
  # date field that always follows.
  cloudfront.distribution.id: '{cloudfront_distribution_id_pattern}(?=\.\d{{4}}-\d{{2}}-\d{{2}}-\d{{2}}\.)'

attribute_extraction_grok_expression: "%{CLOUDFRONTTIMESTAMP:timestamp_to_transform}"

# The W3C output format starts with one or more '#'-prefixed header lines
# (e.g. "#Fields: date time ...").  The plain output format has none.
# header_line_prefix handles both cases: leading '#' lines are skipped and
# skipping stops at the first data line.
header_line_prefix: '#'