  Version:
    Description: dev

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required
        Parameters:
          - DynatraceAwsS3LogForwarderStackName
          - LogsBucketName
      - Label:
          default: Cross-Account / Cross-Region
        Parameters:
          - S3BucketIsCrossRegionOrCrossAccount
      - Label:
          default: Optional S3 Key Prefix Filters (up to 10)
        Parameters:
          - LogsBucketPrefix1
          - LogsBucketPrefix2
          - LogsBucketPrefix3
          - LogsBucketPrefix4
          - LogsBucketPrefix5
          - LogsBucketPrefix6
          - LogsBucketPrefix7
          - LogsBucketPrefix8
          - LogsBucketPrefix9
          - LogsBucketPrefix10
    ParameterLabels:
      DynatraceAwsS3LogForwarderStackName:
        default: Main Forwarder Stack Name
      LogsBucketName:
        default: S3 Bucket Name
      S3BucketIsCrossRegionOrCrossAccount:
        default: Bucket is in a different region or account
      LogsBucketPrefix1:
        default: S3 Key Prefix 1
      LogsBucketPrefix2:
        default: S3 Key Prefix 2
      LogsBucketPrefix3:
        default: S3 Key Prefix 3
      LogsBucketPrefix4:
        default: S3 Key Prefix 4
      LogsBucketPrefix5:
        default: S3 Key Prefix 5
      LogsBucketPrefix6:
        default: S3 Key Prefix 6
      LogsBucketPrefix7:
        default: S3 Key Prefix 7
      LogsBucketPrefix8:
        default: S3 Key Prefix 8
      LogsBucketPrefix9:
        default: S3 Key Prefix 9
      LogsBucketPrefix10:
        default: S3 Key Prefix 10

  Instructions:
    Description: |
      Deploy this template once per every Amazon S3 bucket you want to configure to forward logs to Dynatrace on the same AWS Account and region
      where the dynatrace-aws-platform-monitoring-s3-log-forwarder is deployed. LogBucketPrefix# parameters are optional, only use them if you want to narrow down 
      the ingestion to specific prefixes in your bucket.
      
      Example AWS CLI command:

      aws cloudformation deploy \
          --template-file s3-log-forwarder-bucket-config-template.yaml \
          --stack-name dynatrace-aws-s3-log-forwarder-s3-bucket-configuration-{your-bucket-name} \
          --parameter-overrides DynatraceAwsS3LogForwarderStackName={your-dynatrace-aws-s3-log-forwarder-stack-name} \
              LogsBucketName={your-bucket-name} \
              LogsBucketPrefix1={optional-bucket-prefix-1}/ \
              LogsBucketPrefix2={optional-bucket-prefix-2}/ \
              LogsBucketPrefix3={optional-bucket-prefix-3}/  \
          --capabilities CAPABILITY_IAM

      NOTE: If your S3 bucket is on a different AWS Region or AWS account, add the S3BucketIsCrossRegionOrCrossAccount=true parameter
      don't forget to deploy the eventbridge-cross-{region|account}-forward-rules stack on AWS Region / Account where your S3 bucket is.
      
      Once deployed, configure your S3 Bucket to send notifications to Amazon EventBridge following instructions here:
      https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-event-notifications-eventbridge.html

Parameters:
  DynatraceAwsS3LogForwarderStackName:
    Type: String
    Description: "Name of the main dynatrace-aws-platform-monitoring-s3-log-forwarder CloudFormation stack. Used to import the Lambda IAM role and SQS queue ARN via CloudFormation exports."
  LogsBucketName:
    Type: String
    Description: "Name of the S3 bucket whose 'Object Created' events should be forwarded to the log forwarder."
    AllowedPattern: "^[0-9a-z]+([0-9a-z-.]{1,61}[0-9a-z])$"
  S3BucketIsCrossRegionOrCrossAccount:
    Type: String
    Description: "Set to 'true' if the S3 bucket lives in a different AWS region or account than the forwarder. Requires the main stack to have EnableCrossRegionCrossAccountForwarding=true, and the eventbridge-cross-region-or-account-forward-rules.yaml template deployed in the bucket's region/account."
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  LogsBucketPrefix1:
    Type: String
    Description: "Optional S3 key prefix to filter on. Leave empty to forward objects from the entire bucket. Use Prefix1..Prefix10 to target up to 10 prefixes; trailing slash recommended."
    Default: ""
  LogsBucketPrefix2:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix3:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix4:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix5:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix6:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix7:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix8:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix9:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  LogsBucketPrefix10:
    Type: String
    Description: Optional S3 key prefix (see LogsBucketPrefix1).
    Default: ""
  
Conditions:
  FirstS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix1, ""]]
  SecondS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix2, ""]]
  ThirdS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix3, ""]]
  FourthS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix4, ""]]
  FithS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix5, ""]]
  SixthS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix6, ""]]
  SeventhS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix7, ""]]
  EighthS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix8, ""]]
  NinethS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix9, ""]]
  TenthS3PrefixSpecified: !Not [!Equals [!Ref LogsBucketPrefix10, ""]]
  ConditionS3BucketIsCrossRegionOrCrossAccount: !Equals [ !Ref S3BucketIsCrossRegionOrCrossAccount, "true" ]

Resources:
  LambdaS3Bucket1AccessIAMPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-ReadAccessToBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowGetObjectPermissions"
            Effect: Allow
            Action:
              - s3:getObject
              - s3:getObjectVersion
            Resource:
              - !Join
                - ":"
                - - arn
                  - !Sub ${AWS::Partition}
                  - s3
                  - ""
                  - ""
                  - !Sub ${LogsBucketName}/${LogsBucketPrefix1}*
              - !If 
                  - SecondS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix2}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - ThirdS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix3}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - FourthS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix4}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - FithS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix5}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - SixthS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix6}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - SeventhS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix7}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - EighthS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix8}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - NinethS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix9}*
                  - !Ref "AWS::NoValue"
              - !If 
                  - TenthS3PrefixSpecified
                  - !Join 
                      - ":"
                      - - arn
                        - !Sub ${AWS::Partition}
                        - s3
                        - ""
                        - ""
                        - !Sub ${LogsBucketName}/${LogsBucketPrefix10}*
                  - !Ref "AWS::NoValue"
      Roles: 
        - Fn::ImportValue:
            !Sub "${DynatraceAwsS3LogForwarderStackName}:QueueProcessingFunctionIamRole"

  LogsBucketEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: 
        !Join
          - "-"
          - - !Sub ${DynatraceAwsS3LogForwarderStackName}
            # Get "random" string from AWS::StackId
            -  !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      # If this rule is for a cross-region or cross-account bucket, create the rule on the dedicated bus
      EventBusName:  
        !If 
          - ConditionS3BucketIsCrossRegionOrCrossAccount
          - Fn::ImportValue:
              Fn::Sub:
                ${DynatraceAwsS3LogForwarderStackName}:CrossRegionCrossAccountEventBusArn 
          - default 
      State: ENABLED
      EventPattern:
        source:
          - "aws.s3"
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref LogsBucketName
          object:
            key:
              - !If
                  - FirstS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix1
                  - prefix: ""
              - !If 
                  - SecondS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix2
                  - !Ref AWS::NoValue  
              - !If
                  - ThirdS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix3
                  - !Ref AWS::NoValue  
              - !If
                  - FourthS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix4
                  - !Ref AWS::NoValue  
              - !If
                  - FithS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix5
                  - !Ref AWS::NoValue  
              - !If
                  - SixthS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix6
                  - !Ref AWS::NoValue
              - !If
                  - SeventhS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix7
                  - !Ref AWS::NoValue
              - !If
                  - EighthS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix8
                  - !Ref AWS::NoValue
              - !If
                  - NinethS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix9
                  - !Ref AWS::NoValue  
              - !If
                  - TenthS3PrefixSpecified
                  - prefix: !Ref LogsBucketPrefix10
                  - !Ref AWS::NoValue  
      Targets:
        - Id: "SQSQueue"
          Arn: 
            Fn::ImportValue:
              Fn::Sub:
                ${DynatraceAwsS3LogForwarderStackName}:S3NotificationsQueueArn