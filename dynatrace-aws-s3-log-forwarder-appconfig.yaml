  Version:
    Description: dev

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required
        Parameters:
          - DynatraceAwsS3LogForwarderStackName
    ParameterLabels:
      DynatraceAwsS3LogForwarderStackName:
        default: Main Forwarder Stack Name

  Instructions:
    Description: |
      Deploy this template once per dynatrace-aws-platform-monitoring-s3-log-forwarder deployment.
      Pass the name of the main stack as DynatraceAwsS3LogForwarderStackName.

      Example AWS CLI command:

      aws cloudformation deploy \
          --template-file dynatrace-aws-s3-log-forwarder-appconfig.yaml \
          --stack-name dynatrace-aws-s3-log-forwarder-appconfig-{your-deployment-name} \
          --parameter-overrides DynatraceAwsS3LogForwarderStackName={your-dynatrace-aws-s3-log-forwarder-stack-name} \
          --capabilities CAPABILITY_IAM

      After deployment, redeploy the main stack with LogForwarderConfigurationLocation=aws-appconfig.

Parameters:
  DynatraceAwsS3LogForwarderStackName:
    Type: String
    Description: "Name of the main dynatrace-aws-platform-monitoring-s3-log-forwarder CloudFormation stack. Used to attach the AppConfig IAM permissions to the forwarder's Lambda role and to name the AppConfig application/environment consistently with the main stack."

Resources:
  AppConfigApplication:
    Type: AWS::AppConfig::Application
    Properties:
      Description: "dynatrace-aws-platform-monitoring-s3-log-forwarder application configuration"
      Name: !Sub ${DynatraceAwsS3LogForwarderStackName}-app-config

  LogForwardingConfigurationProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref AppConfigApplication
      Description: "dynatrace-aws-s3-log-forwarder log forwarding rules configuration profile"
      LocationUri: hosted
      Name: log-forwarding-rules
      Type: AWS.Freeform

  LogProcessingConfigurationProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref AppConfigApplication
      Description: "dynatrace-aws-s3-log-forwarder log processing rules configuration profile"
      LocationUri: hosted
      Name: log-processing-rules
      Type: AWS.Freeform

  AppConfigDeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name: !Sub ${DynatraceAwsS3LogForwarderStackName}-AllAtOnce
      DeploymentDurationInMinutes: 0
      FinalBakeTimeInMinutes: 0
      GrowthFactor: 100
      ReplicateTo: NONE

  AppConfigEnvironment:
    Type: AWS::AppConfig::Environment
    Properties:
      Name: !Ref DynatraceAwsS3LogForwarderStackName
      ApplicationId: !Ref AppConfigApplication

  LogForwardingRulesHostedConfiguration:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      Description: dynatrace-aws-s3-log-forwarder log forwarding rules
      ApplicationId: !Ref AppConfigApplication
      ConfigurationProfileId: !Ref LogForwardingConfigurationProfile
      ContentType: application/x-yaml
      Content: |
        ---
        bucket_name: default
        log_forwarding_rules:
          - name: default_forward_all
            prefix: ".*"
            source: aws

  LogProcessingRulesHostedConfiguration:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      Description: dynatrace-aws-s3-log-forwarder log processing rules
      ApplicationId: !Ref AppConfigApplication
      ConfigurationProfileId: !Ref LogProcessingConfigurationProfile
      ContentType: application/x-yaml
      Content: |
        # No custom log processing rules

  LambdaAppConfigPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AppConfigPolicy
      Roles:
        - Fn::ImportValue: !Sub ${DynatraceAwsS3LogForwarderStackName}:QueueProcessingFunctionIamRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - appconfig:StartConfigurationSession
              - appconfig:GetLatestConfiguration
            Resource:
              - !Sub arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${AppConfigApplication}
              - !Sub arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${AppConfigApplication}/environment/${AppConfigEnvironment}/*

  LogForwardingRulesDeployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId: !Ref AppConfigApplication
      ConfigurationProfileId: !Ref LogForwardingConfigurationProfile
      DeploymentStrategyId: !Ref AppConfigDeploymentStrategy
      EnvironmentId: !Ref AppConfigEnvironment
      ConfigurationVersion: !Ref LogForwardingRulesHostedConfiguration

  LogProcessingRulesDeployment:
    Type: AWS::AppConfig::Deployment
    DependsOn: LogForwardingRulesDeployment
    Properties:
      ApplicationId: !Ref AppConfigApplication
      ConfigurationProfileId: !Ref LogProcessingConfigurationProfile
      DeploymentStrategyId: !Ref AppConfigDeploymentStrategy
      EnvironmentId: !Ref AppConfigEnvironment
      ConfigurationVersion: !Ref LogProcessingRulesHostedConfiguration

  SSMParameterAppConfigApplicationId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /dynatrace/s3-log-forwarder/${DynatraceAwsS3LogForwarderStackName}/appconfig-application-id
      Type: String
      Value: !Ref AppConfigApplication
      Description: !Sub "AppConfig application ID for deployment ${DynatraceAwsS3LogForwarderStackName}"

Outputs:
  SSMParameterPathAppConfigApplicationId:
    Description: "SSM Parameter path storing the AppConfig application ID"
    Value: !Sub /dynatrace/s3-log-forwarder/${DynatraceAwsS3LogForwarderStackName}/appconfig-application-id
