AWSTemplateFormatVersion: "2010-09-09"
Description: |
  dynatrace-aws-s3-log-forwarder-appconfig

  Deploys AWS AppConfig resources for the dynatrace-aws-platform-monitoring-s3-log-forwarder,
  allowing runtime customisation of log forwarding and log processing rules without redeploying
  the Lambda function.

  Deploy this template once per dynatrace-aws-platform-monitoring-s3-log-forwarder deployment
  when you want to customise forwarding or processing rules. To update rules, edit the Content
  field of LogForwardingRulesHostedConfiguration or LogProcessingRulesHostedConfiguration in
  this template and redeploy the stack - the Lambda will pick up changes within ~1 minute.

  For more information: https://github.com/Dynatrace/dynatrace-aws-platform-monitoring-s3-log-forwarder

