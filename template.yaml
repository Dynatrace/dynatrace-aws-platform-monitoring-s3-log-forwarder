  S3BucketNamesEventBridgeRule:
    Type: AWS::Events::Rule
    Condition: S3BucketNamesProvided
    Properties:
      Name: !Sub "${AWS::StackName}-s3-notifications"
      State: ENABLED
      EventPattern:
        source:
          - "aws.s3"
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name: !Ref S3BucketNames
      Targets:
        - Id: "SQSQueue"
          Arn: !GetAtt S3NotificationsQueue.Arn

  S3GetObjectPolicy:
    Type: AWS::IAM::Policy
    Condition: S3BucketNamesProvided
    Properties:
      PolicyName: !Sub ${AWS::StackName}-s3-get-object
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Split
              # Input: (string) arn:aws:s3:::bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3/*
              # Output: a list of ARNs arn:aws:s3:::bucket1/*, arn:aws:s3:::bucket2/*, arn:aws:s3:::bucket3/*
              - ","
              - !Sub
                - "arn:aws:s3:::${BucketList}/*"
                # Input: bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3
                # Output: arn:aws:s3:::bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3/* -> adds arn:aws:s3::: prefix to first bucket and /* suffix to last
                - BucketList: !Join
                    - "/*,arn:aws:s3:::"
                    - !Ref S3BucketNames
                    # Input: bucket1,bucket2,bucket3
                    # Output: bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3
      Roles:
        - !Ref QueueProcessingFunctionRole

  KmsDecryptPolicy:
    Type: AWS::IAM::Policy
    Condition: KmsKeyArnsProvided
    Properties:
      PolicyName: !Sub ${AWS::StackName}-kms-decrypt
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref KmsKeyArns
      Roles:
        - !Ref QueueProcessingFunctionRole

  SSMParameterSQSQueueArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/sqs-queue-arn
      Type: String
      Value: !GetAtt S3NotificationsQueue.Arn
      Description: !Sub "ARN of the S3 notifications SQS queue for deployment ${AWS::StackName}"

  SSMParameterLambdaRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/lambda-role-arn
      Type: String
      Value: !GetAtt QueueProcessingFunctionRole.Arn
      Description: !Sub "ARN of the Lambda IAM role for deployment ${AWS::StackName}"

  SSMParameterAppConfigApplicationId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/appconfig-application-id
      Type: String
      Value: !Ref AppConfigApplication
      Description: !Sub "AppConfig application ID for deployment ${AWS::StackName}"

Outputs:
  QueueProcessingFunction:
    Description: "Queue Processing Lambda Function ARN"
    Value: !GetAtt QueueProcessingFunction.Arn
  QueueProcessingFunctionIamRole:
    Description: "IAM Role for QueueProcessingFunction"
    Value: !Ref QueueProcessingFunctionRole
    Export: 
      Name: !Sub "${AWS::StackName}:QueueProcessingFunctionIamRole"
  SQSProcessingQueue:
    Description: "SQS Queue for Lambda to consume notifications from."
    Value: !GetAtt S3NotificationsQueue.Arn
    Export: 
      Name: !Sub "${AWS::StackName}:S3NotificationsQueueArn"
  SQSDeadLetterQueue:
    Description: "Dead letter queue for failed messages."
    Value: !GetAtt SQSDeadLetterQueue.Arn
  SNSAlertsTopic:
    Description: "SNS Topic receiving monitoring alerts"
    Value: !Ref AlarmsSNSTopic
  S3NotificationsSNSTopic:
    Condition: CreateSNSTopicForS3Notifications
    Description: "SNS Topic for receiving S3 Object Created notifications (subscribe your S3 buckets to this topic)"
    Value: !Ref S3NotificationsSNSTopic
    Export:
      Name: !Sub ${AWS::StackName}:S3NotificationsSNSTopicArn
  CrossRegionCrossAccountEventBus:
    Condition: CrossRegionCrossAccountForwardingIsEnabled
    Description: "Amazon EventBridge event bus to receive cross-region and cross-account S3 object created notifications"
    Value: !GetAtt CrossRegionCrossAccountEventBus.Arn
    Export:
      Name: !Sub ${AWS::StackName}:CrossRegionCrossAccountEventBusArn
  CloudWatchDashboardURL:
    Condition: DeployMonitoringDashboard
    Description: "URL for the CloudWatch Dashboard to monitor the dynatrace-aws-s3-log-forwarder"
    Value: !Sub |
              https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=${CloudWatchDashboard}
  AppConfigApplicationId:
    Description: AppConfig configuration application id
    Value: !Ref AppConfigApplication
    Export:
      Name: !Sub ${AWS::StackName}:AppConfigApplicationId
  AppConfigEnvironmentId:
    Description: AppConfig configuration environment id
    Value: !Ref AppConfigEnvironment
    Export:
      Name: !Sub ${AWS::StackName}:AppConfigEnvironmentId
  LogForwardingConfigurationProfile:
    Description: AppConfig Configuration Profile for log forwarding rules
    Value: !Ref LogForwardingConfigurationProfile
    Export:
      Name: !Sub ${AWS::StackName}:LogForwardingConfigurationProfileId
  LogProcessingConfigurationProfile: 
    Description: AppConfig Configuration Profile for log forwarding rules
    Value: !Ref LogProcessingConfigurationProfile
    Export:
      Name: !Sub ${AWS::StackName}:LogProcessingConfigurationProfileId
  AppConfigAllAtOnceDeploymentStrategy:
    Description: Deployment strategy for AWS AppConfig to deploy the log forwarding and processing configuration
    Value: !Ref AppConfigDeploymentStrategy
    Export:
      Name: !Sub ${AWS::StackName}:AppConfigDeploymentStrategyId
  SSMParameterPathSQSQueueArn:
    Description: "SSM Parameter path storing the SQS queue ARN"
    Value: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/sqs-queue-arn
  SSMParameterPathLambdaRoleArn:
    Description: "SSM Parameter path storing the Lambda IAM role ARN"
    Value: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/lambda-role-arn
  SSMParameterPathAppConfigApplicationId:
    Description: "SSM Parameter path storing the AppConfig application ID"
    Value: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/appconfig-application-id
