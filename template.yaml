    eu-west-1:
      Arn: arn:aws:lambda:eu-west-1:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    eu-west-2:
      Arn: arn:aws:lambda:eu-west-2:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
