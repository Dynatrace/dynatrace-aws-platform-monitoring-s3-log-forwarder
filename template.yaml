      Arn: arn:aws:lambda:us-east-2:123456789012:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    us-west-1:
      Arn: arn:aws:lambda:us-west-1:123456789012:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    us-west-2:
      Arn: arn:aws:lambda:us-west-2:123456789012:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
  LayerVersions:
    All:
      x86: 1
      arm64: 1

Conditions:
  IsArm64: !Equals [!Ref Architecture, arm64]
  CrossRegionCrossAccountForwardingIsEnabled: !Equals [ !Ref EnableCrossRegionCrossAccountForwarding, "true" ]
  AwsAccountListIsNotEmpty: !Not [ !Equals [!Join ["", !Ref AwsAccountsToReceiveLogsFrom ], ""] ]
  CreateEventBridgePolicy: !And [ !Condition AwsAccountListIsNotEmpty , !Condition CrossRegionCrossAccountForwardingIsEnabled ]
  DeployMonitoringDashboard: !Equals [ !Ref DeployCloudWatchMonitoringDashboard, "true" ]
  IsEmailConfigured: !Not [!Equals [ !Ref NotificationsEmail, "" ]]
  IsLayerDeployment: !Equals [ !Ref DeploymentPackageType, "layer" ]
  CreateSNSTopicForS3Notifications: !Equals [ !Ref CreateS3NotificationsSNSTopic, "true" ]
  LambdaVpcConfigSpecified: !Not [!Equals [ !Join [ "", !Ref LambdaSubnetIds ], "" ]]
  LambdaVpcSecurityGroupSpecified: !Not [!Equals [!Ref LambdaSecurityGroupId, ""]]
  S3BucketNamesProvided: !Not [!Equals [!Join ["", !Ref S3BucketNames], ""]]
  KmsKeyArnsProvided: !Not [!Equals [!Join ["", !Ref KmsKeyArns], ""]]
  DirectApiKeyProvided: !Not [!Equals [!Ref DynatraceApiKey, ""]]
  ExistingSecretsManagerSecretProvided: !Not [!Equals [!Ref DynatraceApiKeySecretsManagerSecret, ""]]
  ExistingSSMParameterProvided: !Not [!Equals [!Ref DynatraceApiKeySSMParameter, ""]]
  IsLayerArnProvided: !Not [!Equals [!Ref DynatraceS3LogForwarderLayerArn, ""]]
  IsDynatraceProductionEnvironment: !Equals
    - !Select [ 2, !Split [ ".", !Select [ 1, !Split [ "://", !Ref DynatraceEnvironmentURL ] ] ] ]
    - 'dynatrace'

Globals:
  Function:
    Timeout: !Ref LambdaMaximumExecutionTime
    Environment:
      Variables:
        POWERTOOLS_METRICS_NAMESPACE: dynatrace-aws-platform-monitoring-s3-log-forwarder
        DEPLOYMENT_NAME: !Ref AWS::StackName


Resources:
  QueueProcessingFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: !Ref IamRolePath
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If
          - LambdaVpcConfigSpecified
          - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Policies:
        - PolicyName: SQSPollerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                  - sqs:ChangeMessageVisibilityBatch
                  - sqs:DeleteMessageBatch
                Resource: !GetAtt S3NotificationsQueue.Arn
        - !If
          - ExistingSecretsManagerSecretProvided
          - !Ref AWS::NoValue
          - !If
            - DirectApiKeyProvided
            - !Ref AWS::NoValue
            - PolicyName: SSMParameterReadPolicy
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - ssm:GetParameter
                      - ssm:GetParameters
                    Resource:
                      - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DynatraceApiKeySSMParameter}
        - !If
          - ExistingSecretsManagerSecretProvided
          - PolicyName: SecretsManagerReadPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref DynatraceApiKeySecretsManagerSecret
          - !If
            - DirectApiKeyProvided
            - PolicyName: SecretsManagerReadPolicy
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource: !Ref DynatraceApiKeySecret
            - !Ref AWS::NoValue

  QueueProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      InlineCode: !If
        - IsLayerDeployment
        - |
          from app import lambda_handler as handler
        - |
          def lambda_handler(event, context):
              raise NotImplementedError("Placeholder function. Update the function code with the Lambda ZIP package.")
      Handler: !If [IsLayerDeployment, "index.handler", "app.lambda_handler"]
      Runtime: python3.14
      Layers: !If
        - IsLayerDeployment
        - - !If
            - IsLayerArnProvided
            - !Ref DynatraceS3LogForwarderLayerArn
            - !If
              - IsArm64
              - !Sub
                - "${Arn}:${Version}"
                - Arn: !Join ["-arm64", !Split ["{arch}", !FindInMap [LayerArns, !Ref AWS::Region, Arn]]]
                  Version: !FindInMap [LayerVersions, All, arm64]
              - !Sub
                - "${Arn}:${Version}"
                - Arn: !Join ["", !Split ["{arch}", !FindInMap [LayerArns, !Ref AWS::Region, Arn]]]
                  Version: !FindInMap [LayerVersions, All, x86]
        - !Ref AWS::NoValue
      MemorySize: !Ref LambdaFunctionMemorySize
      Architectures:
        - !Ref Architecture
      Environment:
        Variables:
          LD_LIBRARY_PATH: !If [IsLayerDeployment, !Ref "AWS::NoValue", "/var/task/lib"]
          DYNATRACE_ENV_URL: !If
            - IsDynatraceProductionEnvironment
            - !Sub
              - 'https://${Subdomain}.da.dynatrace.com'
              - Subdomain: !Select [ 0, !Split [ ".", !Select [ 1, !Split [ "://", !Ref DynatraceEnvironmentURL ] ] ] ]
            - !Sub
              - 'https://${Subdomain}.da.dynatracelabs.com'
              - Subdomain: !Select [ 0, !Split [ ".apps", !Select [ 0, !Split [ ".dynatracelabs.com", !Select [ 1, !Split [ "://", !Ref DynatraceEnvironmentURL ] ] ] ] ] ]
          DYNATRACE_API_KEY_SECRETS_MANAGER: !If
            - DirectApiKeyProvided
            - !Ref DynatraceApiKeySecret
            - !If
              - ExistingSecretsManagerSecretProvided
              - !Ref DynatraceApiKeySecretsManagerSecret
              - !Ref AWS::NoValue
          DYNATRACE_API_KEY_SSM: !If
            - ExistingSSMParameterProvided
            - !Ref DynatraceApiKeySSMParameter
            - !Ref AWS::NoValue
          QueueName: !GetAtt S3NotificationsQueue.QueueName
          LOGGING_LEVEL: !Ref LambdaLoggingLevel
          LOG_FORWARDER_CONFIGURATION_LOCATION: !Ref LogForwarderConfigurationLocation
          VERIFY_DT_SSL_CERT: !Ref VerifyLogEndpointSSLCerts
          DYNATRACE_LOG_INGEST_CONTENT_MAX_LENGTH: !Ref DynatraceLogIngestContentMaxLength
      Role: !GetAtt QueueProcessingFunctionRole.Arn
      Events:
        SQSMessages:
          Type: SQS
          Properties:
            BatchSize: !Ref LambdaSQSMessageBatchSize
            Enabled: True
            MaximumBatchingWindowInSeconds: !Ref SQSLongPollingMaxSeconds
            Queue: !GetAtt S3NotificationsQueue.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
               MaximumConcurrency: !Ref MaximumLambdaConcurrency
      ReservedConcurrentExecutions: !Ref MaximumLambdaConcurrency
      VpcConfig:
        SecurityGroupIds:
          - !If [ LambdaVpcSecurityGroupSpecified, !Ref LambdaSecurityGroupId, !Ref "AWS::NoValue" ]
        SubnetIds: !If [ LambdaVpcConfigSpecified, !Ref LambdaSubnetIds, !Ref "AWS::NoValue" ]

  S3NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Use crafted queue name to avoid circular dependency with RedriveAllowPolicy
      QueueName: !Sub ${AWS::StackName}-S3NotificationsQueue
      ReceiveMessageWaitTimeSeconds: !Ref SQSLongPollingMaxSeconds
      VisibilityTimeout: !Ref SQSVisibilityTimeout
      MessageRetentionPeriod: 43200
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SQSDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaximumSQSMessageRetries

  # Allow EventBridge rules, SNS topics, and S3 buckets to send messages to SQS
  S3NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Id: "S3NotificationsSQSPolicy"
        Statement:
          - Sid: "Allow EventBridge rules to Send Messages"
            Effect: "Allow"
            Principal:
              Service: "events.amazonaws.com"
            Action: "sqs:SendMessage"
            Resource: !GetAtt S3NotificationsQueue.Arn
            Condition:
              ArnEquals:
                "aws:SourceArn": !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-*"
          - !If
            - CreateSNSTopicForS3Notifications
            - Sid: "Allow SNS topics to Send Messages"
              Effect: "Allow"
              Principal:
                Service: "sns.amazonaws.com"
              Action: "sqs:SendMessage"
              Resource: !GetAtt S3NotificationsQueue.Arn
              Condition:
                ArnEquals:
                  "aws:SourceArn": !Ref S3NotificationsSNSTopic
            - Sid: "Allow SNS topics to Send Messages"
              Effect: "Allow"
              Principal:
                Service: "sns.amazonaws.com"
              Action: "sqs:SendMessage"
              Resource: !GetAtt S3NotificationsQueue.Arn
              Condition:
                ArnLike:
                  "aws:SourceArn": !Sub "arn:aws:sns:*:${AWS::AccountId}:*"
          - !If
            - S3BucketNamesProvided
            - Sid: "Allow S3 buckets to Send Messages"
              Effect: "Allow"
              Principal:
                Service: "s3.amazonaws.com"
              Action: "sqs:SendMessage"
              Resource: !GetAtt S3NotificationsQueue.Arn
              Condition:
                ArnLike:
                  "aws:SourceArn": !Split
                    # Input: (string) arn:aws:s3:::bucket1,arn:aws:s3:::bucket2,arn:aws:s3:::bucket3
                    # Output: a list of ARNs arn:aws:s3:::bucket1, arn:aws:s3:::bucket2, arn:aws:s3:::bucket3
                    - ","
                    - !Sub
                      - "arn:aws:s3:::${BucketList}"
                      # Input: bucket1,arn:aws:s3:::bucket2,arn:aws:s3:::bucket3
                      # Output: arn:aws:s3:::bucket1,arn:aws:s3:::bucket2,arn:aws:s3:::bucket3 -> it just adds the arn:aws:s3::: prefix to first bucket
                      - BucketList: !Join
                          - ",arn:aws:s3:::"
                          - !Ref S3BucketNames
                          # Input: bucket1,bucket2,bucket3
                          # Output: bucket1,arn:aws:s3:::bucket2,arn:aws:s3:::bucket3
            - !Ref AWS::NoValue
      Queues:
        - !Ref S3NotificationsQueue

  SQSDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-S3NotificationsDLQ
      # Keep messages during 1 day for troubleshooting purposes and redrive.
      MessageRetentionPeriod: 86400
      RedriveAllowPolicy:
        redrivePermission: byQueue
        # Hand-crafted ARN to avoid circular dependency
        sourceQueueArns:
          - !Join
            - ":"
            - - arn
              - !Ref AWS::Partition
              - sqs
              - !Ref AWS::Region
              - !Ref AWS::AccountId
              - !Sub ${AWS::StackName}-S3NotificationsQueue

  S3NotificationsSNSTopicKey:
    Type: AWS::KMS::Key
    Condition: CreateSNSTopicForS3Notifications
    Properties:
      Description: CMK for S3 notifications SNS topic — allows S3 to publish to an encrypted topic
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowSNSToUseKey
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
          - Sid: AllowS3ToPublishToEncryptedTopic
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  S3NotificationsSNSTopic:
    Type: AWS::SNS::Topic
    Condition: CreateSNSTopicForS3Notifications
    Properties:
      TopicName: !Sub ${AWS::StackName}-S3Notifications
      KmsMasterKeyId: !Ref S3NotificationsSNSTopicKey

  S3NotificationsSNSSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateSNSTopicForS3Notifications
    DependsOn: S3NotificationsQueuePolicy
    Properties:
      TopicArn: !Ref S3NotificationsSNSTopic
      Protocol: sqs
      Endpoint: !GetAtt S3NotificationsQueue.Arn
      RawMessageDelivery: "false"

  S3NotificationsSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateSNSTopicForS3Notifications
    Properties:
      PolicyDocument:
        Id: "S3NotificationsSNSTopicPolicy"
        Version: "2012-10-17"
        Statement:
          - Sid: "Allow_S3_to_publish"
            Effect: Allow
            Principal:
              Service: "s3.amazonaws.com"
            Action: "sns:Publish"
            Resource: !Ref S3NotificationsSNSTopic
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": "arn:aws:s3:::*"
      Topics:
        - !Ref S3NotificationsSNSTopic

  AlarmsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-Alarms
      KmsMasterKeyId: alias/aws/sns
  
  AlarmsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: IsEmailConfigured
    Properties:
      TopicArn: !Ref AlarmsSNSTopic
      Endpoint: !Ref NotificationsEmail
      Protocol: "email"

  AlarmsSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Id: "AlarmsSNSTopicPolicy"
        Version: "2012-10-17"
        Statement:
          - Sid: "Allow_CW_Alarms_to_publish"
            Effect: Allow
            Principal:
              Service:
                - "cloudwatch.amazonaws.com"
            Action: "sns:Publish"
            Resource: !Ref AlarmsSNSTopic
      Topics:
        - !Ref AlarmsSNSTopic

  # Alarm if DLQ gets messages
  SQSDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Messages landed on the Dead Letter Queue"
      AlarmName: !Sub "${AWS::StackName}-MessagesInDLQ"
      Metrics:
        - Id: "m1"
          Label: "MessagesVisibleMin"
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt SQSDeadLetterQueue.QueueName
              MetricName: ApproximateNumberOfMessagesVisible
              Namespace: "AWS/SQS"
            Period: 300 # evaluate maximum over period of 5 min
            Stat: Minimum
            Unit: Count
          ReturnData: false
        - Id: "m2"
          Label: "MessagesVisibleMax"
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt SQSDeadLetterQueue.QueueName
              MetricName: ApproximateNumberOfMessagesVisible
              Namespace: "AWS/SQS"
            Period: 300 # evaluate maximum over period of 5 min
            Stat: Maximum
            Unit: Count
          ReturnData: false
        - Expression: "m2-m1"
          Id: "e1"
          Label: "ChangeInAmountVisible"
          ReturnData: true
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      AlarmActions:
        - !Ref AlarmsSNSTopic

  CrossRegionCrossAccountEventBus:
    Condition: CrossRegionCrossAccountForwardingIsEnabled
    Type: AWS::Events::EventBus
    Properties:
      Name: 
        !Join
          - "-"
          - - !Sub ${AWS::StackName}
            - cross-region-cross-account-s3-events
  
  CrossAccountEventBusPolicy:
    Condition: CreateEventBridgePolicy
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref CrossRegionCrossAccountEventBus
      StatementId: AllowCrossAccountS3Notifications
      Statement:
        Effect: Allow
        Principal: 
          AWS: !Split 
            - ","
            - !Sub 
              - arn:aws:iam::${ACCOUNTS}:root
              - ACCOUNTS: !Join
                - ':root,arn:aws:iam::'
                - !Ref AwsAccountsToReceiveLogsFrom
        Action: "events:PutEvents"
        Resource: !GetAtt CrossRegionCrossAccountEventBus.Arn
        Condition:
          StringEquals:
            "events:detail-type": "Object Created"
            "events:source": "aws.s3"
          ArnLike:
            "aws:SourceArn":
              - !Sub arn:aws:events:*:*:rule/dt-s3-log-fwd-to-${AWS::AccountId}-*

  MonitoringDashboardStack:
    Condition: DeployMonitoringDashboard
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./cloudwatch-monitoring-dashboard.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        QueueProcessingFunctionName: !Ref QueueProcessingFunction

  S3BucketNamesEventBridgeRule:
    Type: AWS::Events::Rule
    Condition: S3BucketNamesProvided
    Properties:
      Name: !Sub "${AWS::StackName}-s3-notifications"
      State: ENABLED
      EventPattern:
        source:
          - "aws.s3"
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name: !Ref S3BucketNames
      Targets:
        - Id: "SQSQueue"
          Arn: !GetAtt S3NotificationsQueue.Arn

  S3GetObjectPolicy:
    Type: AWS::IAM::Policy
    Condition: S3BucketNamesProvided
    Properties:
      PolicyName: !Sub ${AWS::StackName}-s3-get-object
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Split
              # Input: (string) arn:aws:s3:::bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3/*
              # Output: a list of ARNs arn:aws:s3:::bucket1/*, arn:aws:s3:::bucket2/*, arn:aws:s3:::bucket3/*
              - ","
              - !Sub
                - "arn:aws:s3:::${BucketList}/*"
                # Input: bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3
                # Output: arn:aws:s3:::bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3/* -> adds arn:aws:s3::: prefix to first bucket and /* suffix to last
                - BucketList: !Join
                    - "/*,arn:aws:s3:::"
                    - !Ref S3BucketNames
                    # Input: bucket1,bucket2,bucket3
                    # Output: bucket1/*,arn:aws:s3:::bucket2/*,arn:aws:s3:::bucket3
      Roles:
        - !Ref QueueProcessingFunctionRole

  KmsDecryptPolicy:
    Type: AWS::IAM::Policy
    Condition: KmsKeyArnsProvided
    Properties:
      PolicyName: !Sub ${AWS::StackName}-kms-decrypt
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref KmsKeyArns
      Roles:
        - !Ref QueueProcessingFunctionRole

  DynatraceApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: DirectApiKeyProvided
    Properties:
      Name: !Sub dynatrace/s3-log-forwarder/${AWS::StackName}/api-key
      SecretString: !Sub '{"dt.platform_token": "${DynatraceApiKey}"}'
      Description: !Sub "Dynatrace API key for deployment ${AWS::StackName}"

  SSMParameterSQSQueueArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/sqs-queue-arn
      Type: String
      Value: !GetAtt S3NotificationsQueue.Arn
      Description: !Sub "ARN of the S3 notifications SQS queue for deployment ${AWS::StackName}"

  SSMParameterLambdaRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/lambda-role-arn
      Type: String
      Value: !GetAtt QueueProcessingFunctionRole.Arn
      Description: !Sub "ARN of the Lambda IAM role for deployment ${AWS::StackName}"

Outputs:
  QueueProcessingFunction:
    Description: "Queue Processing Lambda Function ARN"
    Value: !GetAtt QueueProcessingFunction.Arn
  QueueProcessingFunctionIamRole:
    Description: "IAM Role for QueueProcessingFunction"
    Value: !Ref QueueProcessingFunctionRole
    Export: 
      Name: !Sub "${AWS::StackName}:QueueProcessingFunctionIamRole"
  SQSProcessingQueue:
    Description: "SQS Queue for Lambda to consume notifications from."
    Value: !GetAtt S3NotificationsQueue.Arn
    Export: 
      Name: !Sub "${AWS::StackName}:S3NotificationsQueueArn"
  SQSDeadLetterQueue:
    Description: "Dead letter queue for failed messages."
    Value: !GetAtt SQSDeadLetterQueue.Arn
  SNSAlertsTopic:
    Description: "SNS Topic receiving monitoring alerts"
    Value: !Ref AlarmsSNSTopic
  S3NotificationsSNSTopic:
    Condition: CreateSNSTopicForS3Notifications
    Description: "SNS Topic for receiving S3 Object Created notifications (subscribe your S3 buckets to this topic)"
    Value: !Ref S3NotificationsSNSTopic
    Export:
      Name: !Sub ${AWS::StackName}:S3NotificationsSNSTopicArn
  CrossRegionCrossAccountEventBus:
    Condition: CrossRegionCrossAccountForwardingIsEnabled
    Description: "Amazon EventBridge event bus to receive cross-region and cross-account S3 object created notifications"
    Value: !GetAtt CrossRegionCrossAccountEventBus.Arn
    Export:
      Name: !Sub ${AWS::StackName}:CrossRegionCrossAccountEventBusArn
  CloudWatchDashboardURL:
    Condition: DeployMonitoringDashboard
    Description: "URL for the CloudWatch Dashboard to monitor the dynatrace-aws-s3-log-forwarder"
    Value: !Sub
      - "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=${DashboardName}"
      - DashboardName: !GetAtt MonitoringDashboardStack.Outputs.DashboardName
  SSMParameterPathSQSQueueArn:
    Description: "SSM Parameter path storing the SQS queue ARN"
    Value: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/sqs-queue-arn
  SSMParameterPathLambdaRoleArn:
    Description: "SSM Parameter path storing the Lambda IAM role ARN"
    Value: !Sub /dynatrace/s3-log-forwarder/${AWS::StackName}/lambda-role-arn
  SecretsManagerSecretArnDynatraceApiKey:
    Condition: DirectApiKeyProvided
    Description: "ARN of the Secrets Manager secret where the Dynatrace API key was stored by the stack"
    Value: !Ref DynatraceApiKeySecret

