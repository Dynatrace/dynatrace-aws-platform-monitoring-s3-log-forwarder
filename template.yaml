      Arn: arn:aws:lambda:ap-northeast-2:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    ap-northeast-3:
      Arn: arn:aws:lambda:ap-northeast-3:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    ap-south-1:
      Arn: arn:aws:lambda:ap-south-1:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    ap-south-2:
      Arn: arn:aws:lambda:ap-south-2:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    ap-southeast-1:
      Arn: arn:aws:lambda:ap-southeast-1:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    ap-southeast-2:
      Arn: arn:aws:lambda:ap-southeast-2:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
    ap-southeast-3:
      Arn: arn:aws:lambda:ap-southeast-3:335651422829:layer:dynatrace-aws-platform-monitoring-s3-log-forwarder{arch}
