# Requirements:
#   - Repo variable SNYK_ORG_ID  : Snyk Organization ID (UUID) for capability_data_acquisition.
#                                  Get it at app.snyk.io → Settings → General → Organization ID.
#   - Repo secret  SNYK_TOKEN    : Snyk API token (set as a GitHub secret).
---
name: Snyk

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-container:
    name: Snyk Container (build environment / native libs)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build build environment image
        run: docker build -f scripts/Dockerfile.build -t lambda-build-env .
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk container test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test lambda-build-env --file=scripts/Dockerfile.build --severity-threshold=high --policy-path=.snyk --org=${{ vars.SNYK_ORG_ID }}
      - name: Snyk container monitor (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container monitor lambda-build-env --file=scripts/Dockerfile.build --policy-path=.snyk --org=${{ vars.SNYK_ORG_ID }}

  snyk-open-source:
    name: Snyk Open Source (Python deps)
    # Skip on PRs from forks — secrets are not available in fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install runtime dependencies
        # Snyk's Python scanner inspects the resolved environment — without this
        # step it errors with SNYK-OS-PYTHON-0013.
        run: pip install -r src/requirements.txt
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=src/requirements.txt --severity-threshold=high --org=${{ vars.SNYK_ORG_ID }}
      - name: Snyk monitor (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=src/requirements.txt --org=${{ vars.SNYK_ORG_ID }}

  snyk-code:
    name: Snyk Code (SAST)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk Code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high --org=${{ vars.SNYK_ORG_ID }}

  snyk-iac:
    name: Snyk IaC (CloudFormation)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk IaC test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk iac test --severity-threshold=high --org=${{ vars.SNYK_ORG_ID }}
