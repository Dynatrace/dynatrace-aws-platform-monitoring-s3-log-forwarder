# Required GitHub Actions secrets:
#   AWS_CICD_ROLE_ARN              - IAM role ARN for OIDC authentication
#   AWS_LAYER_PUBLISHING_ROLE_ARN  - IAM role ARN in the layer publishing account (335651422829) used to publish Lambda layers
#   CFN_ROLE_ARN                   - IAM role ARN passed to CloudFormation deploy for the released-version upgrade E2E test
#   DT_TENANT_PLATFORM_URL         - Dynatrace platform URL for log validation queries
#   DT_SSO_URL                     - Dynatrace SSO URL for OAuth token exchange
#   DT_OAUTH_CLIENT_ID             - OAuth client ID for log validation
#   DT_OAUTH_CLIENT_SECRET         - OAuth client secret for log validation
---
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  release-x86_64:
    name: Release (x86_64)
    runs-on: ubuntu-latest
    env:
      RELEASE_BUCKET: dynatrace-aws-s3-log-forwarder-assets
      RELEASE_PREFIX: platform-monitoring/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update version in templates and source
        env:
          GIT_TAG: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda ZIP
        run: ./scripts/build_docker.sh zip dist/lambda-x86_64.zip x86_64
      - name: Upload Lambda ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-x86_64
          path: dist/lambda-x86_64.zip
          retention-days: 1
          overwrite: true
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer-x86_64.zip x86_64
      - name: Configure AWS credentials for layer publishing
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_LAYER_PUBLISHING_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish Lambda Layer to all commercial regions
        run: ./scripts/publish_layer.sh dist/layer-x86_64.zip --arns-output layer-arns-x86.txt
      # Layer versions are a per-region counter in AWS and diverge between regions,
      # so the full region=arn list is handed to release-s3 as an artifact rather
      # than collapsed into a single version number.
      - name: Upload published layer ARNs
        uses: actions/upload-artifact@v7
        with:
          name: layer-arns-x86
          path: layer-arns-x86.txt
          retention-days: 1
          overwrite: true

  release-arm64:
    name: Release (arm64)
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_BUCKET: dynatrace-aws-s3-log-forwarder-assets
      RELEASE_PREFIX: platform-monitoring/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update version in templates and source
        env:
          GIT_TAG: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda ZIP
        run: ./scripts/build_docker.sh zip dist/lambda-arm64.zip arm64
      - name: Upload Lambda ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-arm64
          path: dist/lambda-arm64.zip
          retention-days: 1
          overwrite: true
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer-arm64.zip arm64
      - name: Configure AWS credentials for layer publishing
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_LAYER_PUBLISHING_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish Lambda Layer to all commercial regions
        run: ./scripts/publish_layer.sh dist/layer-arm64.zip --arch arm64 --arns-output layer-arns-arm64.txt
      - name: Upload published layer ARNs
        uses: actions/upload-artifact@v7
        with:
          name: layer-arns-arm64
          path: layer-arns-arm64.txt
          retention-days: 1
          overwrite: true

  release-s3:
    name: Upload CloudFormation templates to S3
    runs-on: ubuntu-latest
    needs: [release-x86_64, release-arm64]
    env:
      RELEASE_BUCKET: dynatrace-aws-s3-log-forwarder-assets
      RELEASE_PREFIX: platform-monitoring/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update version in templates and source
        env:
          GIT_TAG: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      # This job runs on a fresh checkout, so it does not inherit the template edits
      # made by the publish jobs. Re-apply them from the published ARNs instead.
      - name: Download published layer ARNs
        uses: actions/download-artifact@v8
        with:
          pattern: layer-arns-*
          path: layer-arns
          merge-multiple: true
      - name: Set layer ARNs in template
        run: |
          set -euo pipefail
          for arch in x86 arm64; do
            file="layer-arns/layer-arns-${arch}.txt"
            if [[ ! -s "${file}" ]]; then
              echo "::error::${file} is missing or empty — the ${arch} layer publish produced no ARNs."
              echo "::error::Refusing to release a template that still points at the checked-in layer versions."
              exit 1
            fi
            python3 scripts/update_layer_arns.py \
              --template template.yaml --arch-key "${arch}" < "${file}"
          done
      - name: Rewrite nested TemplateURL to release S3 URL
        run: |
          NESTED_URL="https://${RELEASE_BUCKET}.s3.amazonaws.com/${RELEASE_PREFIX}/cloudwatch-monitoring-dashboard.yaml"
          ./scripts/rewrite_nested_template_url.sh "${NESTED_URL}"
      # ci.yml validates the committed template, but the two steps above rewrite
      # it after that gate. Validate the artifact that is actually released.
      - name: Validate rewritten CloudFormation template
        run: aws cloudformation validate-template --template-body file://template.yaml
      - name: Upload CloudFormation templates to S3
        run: |
          aws s3 cp template.yaml s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/
          aws s3 cp cloudwatch-monitoring-dashboard.yaml s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/
          aws s3 cp dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/
          aws s3 cp eventbridge-cross-region-or-account-forward-rules.yaml s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/
          aws s3 cp dynatrace-aws-s3-log-forwarder-appconfig.yaml s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/
          zip templates.zip -j template.yaml \
            cloudwatch-monitoring-dashboard.yaml \
            dynatrace-aws-s3-log-forwarder-appconfig.yaml \
            dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml \
            eventbridge-cross-region-or-account-forward-rules.yaml
          aws s3 cp templates.zip s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/
      - name: Upload CloudFormation template artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cfn-templates
          path: |
            template.yaml
            cloudwatch-monitoring-dashboard.yaml
            dynatrace-aws-s3-log-forwarder-appconfig.yaml
            dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml
            eventbridge-cross-region-or-account-forward-rules.yaml
            templates.zip
          retention-days: 1
          overwrite: true

  # Upgrade test: upgrades the pre-deployed, long-lived released-version stacks in-place to the artifacts
  # of this release (template + published layer) and validates EventBridge forwarding. Stacks are kept.
  e2e-test-upgrade-released:
    name: End-to-end upgrade test of released version (${{ matrix.region }})
    runs-on: ubuntu-latest
    needs: [release-s3]
    concurrency:
      group: e2e-upgrade-test-released-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: us-east-1
            bucket: permanent-s3-log-forwarder-released-version-us-east-1
          - region: eu-central-1
            bucket: permanent-s3-log-forwarder-released-version-eu-central-1
    env:
      E2E_TESTING_BUCKET_NAME: ${{ matrix.bucket }}
      STACK_NAME: permanent-s3-log-forwarder-released-version
      E2E_TEST_PREFIX: test/verification/${{ github.run_id }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ matrix.region }}
      - name: Download released CloudFormation templates
        uses: actions/download-artifact@v8
        with:
          name: cfn-templates
          path: release-assets
      # Parameters that are not overridden keep the values already set on the stack. Clearing
      # DynatraceS3LogForwarderLayerArn makes the stack use the layer published by this release.
      - name: Upgrade forwarder
        run: |
          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME}" >/dev/null; then
            echo "::error::Stack ${STACK_NAME} does not exist in ${{ matrix.region }}; the released-version stack must be pre-deployed"
            exit 1
          fi
          aws cloudformation deploy \
            --stack-name "${STACK_NAME}" \
            --template-file release-assets/template.yaml \
            --parameter-overrides \
              DeploymentPackageType=layer \
              DynatraceS3LogForwarderLayerArn= \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --role-arn "${CFN_ROLE_ARN}" \
            --no-fail-on-empty-changeset
      - name: Upgrade per-bucket S3 notification configuration stack
        run: |
          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME}-s3-cfg" >/dev/null; then
            echo "::error::Stack ${STACK_NAME}-s3-cfg does not exist in ${{ matrix.region }}; the released-version stack must be pre-deployed"
            exit 1
          fi
          aws cloudformation deploy \
            --template-file release-assets/dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml \
            --stack-name "${STACK_NAME}-s3-cfg" \
            --parameter-overrides \
              DynatraceAwsS3LogForwarderStackName=${STACK_NAME} \
              LogsBucketName=${E2E_TESTING_BUCKET_NAME} \
              LogsBucketPrefix1=test/verification/ \
            --capabilities CAPABILITY_IAM \
            --role-arn "${CFN_ROLE_ARN}" \
            --no-fail-on-empty-changeset
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      - name: Test EventBridge notification
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E released version upgrade validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/test.log

  release-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-x86_64, release-arm64, release-s3, e2e-test-upgrade-released]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cfn-templates
          path: release-assets
      - name: Download Lambda ZIP artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lambda-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            release-assets/template.yaml \
            release-assets/cloudwatch-monitoring-dashboard.yaml \
            release-assets/dynatrace-aws-s3-log-forwarder-appconfig.yaml \
            release-assets/dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml \
            release-assets/eventbridge-cross-region-or-account-forward-rules.yaml \
            release-assets/lambda-x86_64.zip \
            release-assets/lambda-arm64.zip \
            release-assets/templates.zip \
            --clobber
      - name: Add Lambda Layer ARN table to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" --json body -q .body > current-notes.md
          python3 scripts/render_layer_arns_table.py \
            --template release-assets/template.yaml \
            --notes current-notes.md \
            --output updated-notes.md
          gh release edit "${{ github.ref_name }}" --notes-file updated-notes.md