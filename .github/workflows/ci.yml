# Required GitHub Actions secrets:
#   AWS_CICD_ROLE_ARN            - IAM role ARN for OIDC authentication
#   CFN_ROLE_ARN                 - IAM role ARN passed to CloudFormation deploy for E2E tests
#   DT_TOKEN_SECRET_ARN          - ARN of existing Secrets Manager secret storing the Dynatrace platform token (all e2e tests)
#   DT_TENANT_PLATFORM_URL       - Dynatrace platform URL for log validation queries
#   DT_SSO_URL                   - Dynatrace SSO URL for OAuth token exchange
#   DT_OAUTH_CLIENT_ID           - OAuth client ID for log validation
#   DT_OAUTH_CLIENT_SECRET       - OAuth client secret for log validation
---
name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-cfn-templates:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Validate CloudFormation templates
        run: |
          aws cloudformation validate-template --template-body file://template.yaml
          aws cloudformation validate-template --template-body file://cloudwatch-monitoring-dashboard.yaml
          aws cloudformation validate-template --template-body file://dynatrace-aws-s3-log-forwarder-layer.yaml
          aws cloudformation validate-template --template-body file://dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml
          aws cloudformation validate-template --template-body file://eventbridge-cross-region-or-account-forward-rules.yaml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - name: Run unit tests
        run: |
          cd src && env $(grep -v '^#' ../tests/unit/unit_test.env | xargs) \
            python -m unittest discover -s ../tests -b

  build-x86_64:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - name: Update version
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer.zip x86_64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts-x86_64
          path: |
            dist/layer.zip
          retention-days: 7

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - name: Update version
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer.zip arm64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts-arm64
          path: |
            dist/layer.zip
          retention-days: 7

  e2e-test:
    name: End-to-end deployment test (${{ matrix.deploy_type }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    needs: [unit-tests, build-x86_64, build-arm64]
    concurrency:
      group: e2e-test-${{ matrix.deploy_type }}-${{ matrix.arch }}
      cancel-in-progress: false
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - deploy_type: layer
            arch: x86_64
            runs-on: ubuntu-latest
            artifact: lambda-artifacts-x86_64
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-x86-64
          - deploy_type: layer
            arch: arm64
            runs-on: ubuntu-24.04-arm
            artifact: lambda-artifacts-arm64
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-arm64
    env:
      E2E_TESTING_BUCKET_NAME: ${{ matrix.bucket }}
      CI_RUN_ID: ${{ github.run_id }}
      DT_TOKEN_SECRET_ARN: ${{ secrets.DT_TOKEN_SECRET_ARN }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Set stack name and test prefix
        run: |
          DEPLOY_SHORT=$([[ "${{ matrix.deploy_type }}" == "layer" ]] && echo "lyr" || echo "zip")
          ARCH_SHORT=$([[ "${{ matrix.arch }}" == "arm64" ]] && echo "arm" || echo "x86")
          echo "STACK_NAME=e2e-dt-aws-s3-log-forwarder-${DEPLOY_SHORT}-${ARCH_SHORT}-${{ github.run_id }}" >> $GITHUB_ENV
          echo "E2E_TEST_PREFIX=test/${{ github.run_id }}/${{ matrix.deploy_type }}/${{ matrix.arch }}" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      # Phase 1: EventBridge
      - name: Deploy forwarder
        id: deploy_forwarder
        run: ./tests/e2e/deploy_forwarder.sh ${{ matrix.deploy_type }} ${{ matrix.arch }}
      - name: Test EventBridge notification
        id: test_eventbridge
        if: steps.deploy_forwarder.outcome == 'success'
        run: |
          ./tests/e2e/configure_notifications.sh eventbridge ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME} ${E2E_TEST_PREFIX}/eventbridge ${{ secrets.CFN_ROLE_ARN }}
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E testing validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/eventbridge/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/eventbridge/test.log
      - name: Delete EventBridge bucket configuration stack
        if: always()
        run: |
          aws cloudformation delete-stack --stack-name ${STACK_NAME}-s3-bucket-configuration || true
          aws cloudformation wait stack-delete-complete --stack-name ${STACK_NAME}-s3-bucket-configuration || true
      # Phase 2: SNS
      - name: Update forwarder for SNS (NotificationType=SNS)
        id: update_forwarder_sns
        if: steps.test_eventbridge.outcome == 'success'
        run: |
          SNS_TOPIC_ARN=$(aws sns create-topic \
              --name "${STACK_NAME}-s3-notifications" \
              --query TopicArn --output text)
          AWS_ACCOUNT_ID=$(cut -d: -f5 <<< "${SNS_TOPIC_ARN}")
          SNS_POLICY=$(jq -n \
              --arg topic_arn "${SNS_TOPIC_ARN}" \
              --arg account_id "${AWS_ACCOUNT_ID}" \
              --arg bucket_arn "arn:aws:s3:::${E2E_TESTING_BUCKET_NAME}" \
              '{Version:"2012-10-17",Statement:[{Sid:"AllowS3ToPublish",Effect:"Allow",Principal:{Service:"s3.amazonaws.com"},Action:"sns:Publish",Resource:$topic_arn,Condition:{StringEquals:{"aws:SourceAccount":$account_id},ArnLike:{"aws:SourceArn":$bucket_arn}}}]}')
          aws sns set-topic-attributes \
              --topic-arn "${SNS_TOPIC_ARN}" \
              --attribute-name Policy \
              --attribute-value "${SNS_POLICY}"

          CHANGE_SET_NAME="cs-switch-to-sns-$(date +%s)"
          PARAMS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Parameters[].ParameterKey' --output json | \
            jq --arg bucket "${E2E_TESTING_BUCKET_NAME}" \
               --arg topic_arn "${SNS_TOPIC_ARN}" \
              '[.[] | select(. != "GrantReadPermissionToBuckets" and . != "NotificationType" and . != "S3NotificationsSNSTopicArns") | {"ParameterKey": ., "UsePreviousValue": true}]
               + [{"ParameterKey": "GrantReadPermissionToBuckets", "ParameterValue": $bucket},
                  {"ParameterKey": "NotificationType", "ParameterValue": "SNS"},
                  {"ParameterKey": "S3NotificationsSNSTopicArns", "ParameterValue": $topic_arn}]')
          aws cloudformation create-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${CHANGE_SET_NAME}" \
            --use-previous-template \
            --parameters "${PARAMS}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --role-arn "${CFN_ROLE_ARN}"
          aws cloudformation wait change-set-create-complete \
            --stack-name "${STACK_NAME}" --change-set-name "${CHANGE_SET_NAME}"
          aws cloudformation execute-change-set \
            --stack-name "${STACK_NAME}" --change-set-name "${CHANGE_SET_NAME}"
          aws cloudformation wait stack-update-complete --stack-name "${STACK_NAME}"
      - name: Configure SNS notifications
        id: configure_sns
        if: steps.update_forwarder_sns.outcome == 'success'
        run: ./tests/e2e/configure_notifications.sh sns ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME} ${E2E_TEST_PREFIX} ${{ secrets.CFN_ROLE_ARN }}
      - name: Test SNS notifications
        id: test_sns
        if: steps.configure_sns.outcome == 'success'
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E SNS validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/sns/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/sns/test.log
      # Phase 3: Direct SQS
      - name: Update forwarder for Direct SQS (NotificationType=Direct SQS)
        id: update_forwarder_direct_sqs
        if: steps.test_sns.outcome == 'success'
        run: |
          CHANGE_SET_NAME="cs-switch-to-direct-sqs-$(date +%s)"
          PARAMS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Parameters[].ParameterKey' --output json | \
            jq '[.[] | select(. != "NotificationType" and . != "S3NotificationsSNSTopicArns") | {"ParameterKey": ., "UsePreviousValue": true}]
               + [{"ParameterKey": "NotificationType", "ParameterValue": "Direct SQS"},
                  {"ParameterKey": "S3NotificationsSNSTopicArns", "ParameterValue": ""}]')
          aws cloudformation create-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${CHANGE_SET_NAME}" \
            --use-previous-template \
            --parameters "${PARAMS}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --role-arn "${CFN_ROLE_ARN}"
          aws cloudformation wait change-set-create-complete \
            --stack-name "${STACK_NAME}" --change-set-name "${CHANGE_SET_NAME}"
          aws cloudformation execute-change-set \
            --stack-name "${STACK_NAME}" --change-set-name "${CHANGE_SET_NAME}"
          aws cloudformation wait stack-update-complete --stack-name "${STACK_NAME}"
      - name: Configure Direct SQS notifications
        id: configure_direct_sqs
        if: steps.update_forwarder_direct_sqs.outcome == 'success'
        run: ./tests/e2e/configure_notifications.sh direct-sqs ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME} ${E2E_TEST_PREFIX} ${{ secrets.CFN_ROLE_ARN }}
      - name: Test Direct SQS notifications
        if: steps.configure_direct_sqs.outcome == 'success'
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E Direct SQS validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/direct-sqs/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/direct-sqs/test.log
      - name: Clean up notifications
        if: always()
        run: |
          aws s3api put-bucket-notification-configuration \
            --bucket ${E2E_TESTING_BUCKET_NAME} \
            --notification-configuration '{"EventBridgeConfiguration":{}}' || true
      - name: Clean up resources
        if: always()
        run: ./tests/e2e/clean_up_resources.sh

  # Default flow: layer, x86_64, no prefixes filtering, KMS-encrypted bucket, custom IAM role path
  e2e-test-default:
    name: End-to-end deployment test (default flow)
    runs-on: ubuntu-latest
    needs: [unit-tests, build-x86_64]
    concurrency:
      group: e2e-test-default
      cancel-in-progress: false
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      DT_TENANT_URL: ${{ secrets.DT_TENANT_URL }}
      E2E_TESTING_BUCKET_NAME: dynatrace-aws-s3-log-forwarder-e2e-testing-default
      CI_RUN_ID: ${{ github.run_id }}
      DT_TOKEN_SECRET_ARN: ${{ secrets.DT_TOKEN_SECRET_ARN }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
      KMS_KEY_ARNS: arn:aws:kms:us-east-1:558221435292:key/23267ae3-cab2-4ef2-a2ed-4ba4b5676444
      IAM_ROLE_PATH: /e2e-iam-role-path/
      S3_BUCKET_NAMES: dynatrace-aws-s3-log-forwarder-e2e-testing-default
    steps:
      - uses: actions/checkout@v7
      - name: Set stack name and test prefix
        run: |
          echo "STACK_NAME=e2e-dt-aws-s3-log-forwarder-default-${{ github.run_id }}" >> $GITHUB_ENV
          echo "E2E_TEST_PREFIX=test/${{ github.run_id }}/default" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: lambda-artifacts-x86_64
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      - name: Deploy forwarder
        run: ./tests/e2e/deploy_forwarder.sh layer x86_64
      - name: Test EventBridge notification
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E default flow validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/test.log
      - name: Clean up resources
        if: always()
        run: ./tests/e2e/clean_up_resources.sh
