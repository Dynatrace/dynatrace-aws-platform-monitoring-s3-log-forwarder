# Required GitHub Actions secrets:
#   AWS_CICD_ROLE_ARN            - IAM role ARN for OIDC authentication
#   CFN_ROLE_ARN                 - IAM role ARN passed to CloudFormation deploy for E2E tests
#   DT_TENANT_PLATFORM_TOKEN     - Dynatrace platform token used to create the SSM parameter during E2E deployment
#   DT_TENANT_PLATFORM_URL       - Dynatrace platform URL for log validation queries
#   DT_SSO_URL                   - Dynatrace SSO URL for OAuth token exchange
#   DT_OAUTH_CLIENT_ID           - OAuth client ID for log validation
#   DT_OAUTH_CLIENT_SECRET       - OAuth client secret for log validation
---
name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-cfn-templates:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Validate CloudFormation templates
        run: |
          aws cloudformation validate-template --template-body file://template.yaml
          aws cloudformation validate-template --template-body file://cloudwatch-monitoring-dashboard.yaml
          aws cloudformation validate-template --template-body file://dynatrace-aws-s3-log-forwarder-layer.yaml
          aws cloudformation validate-template --template-body file://dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml
          aws cloudformation validate-template --template-body file://eventbridge-cross-region-or-account-forward-rules.yaml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - name: Run unit tests
        run: |
          cd src && env $(grep -v '^#' ../tests/unit/unit_test.env | xargs) \
            python -m unittest discover -s ../tests -b

  build-x86_64:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6
      - name: Update version
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda ZIP
        run: ./scripts/build_docker.sh zip dist/lambda.zip x86_64
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer.zip x86_64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts-x86_64
          path: |
            dist/lambda.zip
            dist/layer.zip
          retention-days: 7

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6
      - name: Update version
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda ZIP
        run: ./scripts/build_docker.sh zip dist/lambda.zip arm64
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer.zip arm64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts-arm64
          path: |
            dist/lambda.zip
            dist/layer.zip
          retention-days: 7

  e2e-test:
    name: End-to-end deployment test (${{ matrix.deploy_type }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    needs: [unit-tests, build-x86_64, build-arm64]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - deploy_type: zip
            arch: x86_64
            runs-on: ubuntu-latest
            artifact: lambda-artifacts-x86_64
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-x86-64
          - deploy_type: zip
            arch: arm64
            runs-on: ubuntu-24.04-arm
            artifact: lambda-artifacts-arm64
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-arm64
          - deploy_type: layer
            arch: x86_64
            runs-on: ubuntu-latest
            artifact: lambda-artifacts-x86_64
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-x86-64
          - deploy_type: layer
            arch: arm64
            runs-on: ubuntu-24.04-arm
            artifact: lambda-artifacts-arm64
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-arm64
    env:
      E2E_TESTING_BUCKET_NAME: ${{ matrix.bucket }}
      CI_RUN_ID: ${{ github.run_id }}
      DT_TENANT_PLATFORM_TOKEN: ${{ secrets.DT_TENANT_PLATFORM_TOKEN }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - name: Set stack name and test prefix
        run: |
          DEPLOY_SHORT=$([[ "${{ matrix.deploy_type }}" == "layer" ]] && echo "lyr" || echo "zip")
          ARCH_SHORT=$([[ "${{ matrix.arch }}" == "arm64" ]] && echo "arm" || echo "x86")
          echo "STACK_NAME=e2e-dt-aws-s3-log-forwarder-${DEPLOY_SHORT}-${ARCH_SHORT}-${{ github.run_id }}" >> $GITHUB_ENV
          echo "E2E_TEST_PREFIX=test/${{ github.run_id }}/${{ matrix.deploy_type }}/${{ matrix.arch }}" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      - name: Print DT URLs
        run: |
          echo "DT_TENANT_URL=${DT_TENANT_URL}"
          echo "DT_TENANT_PLATFORM_URL=${DT_TENANT_PLATFORM_URL}"
      - name: Deploy forwarder
        run: ./tests/e2e/deploy_forwarder.sh ${{ matrix.deploy_type }} ${{ matrix.arch }}
      - name: Test EventBridge notification
        run: |
          ./tests/e2e/configure_notifications.sh eventbridge ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME} ${E2E_TEST_PREFIX}/eventbridge ${{ secrets.CFN_ROLE_ARN }}
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E testing validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/eventbridge/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/eventbridge/test.log
      - name: Clean up EventBridge notification
        if: always()
        run: ./tests/e2e/clean_up_notifications.sh eventbridge ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME}
      - name: Update forwarder for SNS/SQS tests
        if: success() || failure()
        run: |
          CHANGE_SET_NAME="awscli-cloudformation-add-s3-access-$(date +%s)"
          PARAMS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Parameters[].ParameterKey' --output json | \
            jq --arg bucket "${E2E_TESTING_BUCKET_NAME}" \
              '[.[] | {"ParameterKey": ., "UsePreviousValue": true}]
               + [{"ParameterKey": "S3BucketNames", "ParameterValue": $bucket},
                  {"ParameterKey": "CreateS3NotificationsSNSTopic", "ParameterValue": "true"}]')
          aws cloudformation create-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${CHANGE_SET_NAME}" \
            --use-previous-template \
            --parameters "${PARAMS}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --role-arn "${CFN_ROLE_ARN}"
          aws cloudformation wait change-set-create-complete \
            --stack-name "${STACK_NAME}" --change-set-name "${CHANGE_SET_NAME}"
          aws cloudformation execute-change-set \
            --stack-name "${STACK_NAME}" --change-set-name "${CHANGE_SET_NAME}"
          aws cloudformation wait stack-update-complete --stack-name "${STACK_NAME}"
      - name: Configure SNS and SQS notifications
        if: success() || failure()
        run: ./tests/e2e/configure_notifications.sh sns-sqs ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME} ${E2E_TEST_PREFIX} ${{ secrets.CFN_ROLE_ARN }}
      - name: Test SNS and SQS notifications
        if: success() || failure()
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E testing validation log entry" > test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/sns/test.log
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/sqs/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/sns/test.log &
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/sqs/test.log &
          RESULT=0
          wait -n || RESULT=$?
          wait -n || RESULT=$?
          exit $RESULT
      - name: Clean up SNS and SQS notifications
        if: always()
        run: ./tests/e2e/clean_up_notifications.sh sns-sqs ${STACK_NAME} ${E2E_TESTING_BUCKET_NAME}
      - name: Clean up resources
        if: always()
        run: ./tests/e2e/clean_up_resources.sh

  e2e-test-default:
    name: End-to-end deployment test (default flow)
    runs-on: ubuntu-latest
    needs: [unit-tests, build-x86_64]
    if: false # temporarily disabled
    env:
      E2E_TESTING_BUCKET_NAME: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-eventbridge
      DT_TENANT_URL: ${{ secrets.DT_TENANT_URL }}
      DT_TENANT_PLATFORM_TOKEN: ${{ secrets.DT_TENANT_PLATFORM_TOKEN }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
      KMS_KEY_ARNS: ${{ secrets.KMS_KEY_ARN }}
      IAM_ROLE_PATH: /e2e-iam-role-path/
    steps:
      - uses: actions/checkout@v6
      - name: Set stack name and test prefix
        run: |
          echo "STACK_NAME=e2e-dt-aws-s3-log-forwarder-default-${{ github.run_id }}" >> $GITHUB_ENV
          echo "E2E_TEST_PREFIX=test/${{ github.run_id }}/default" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: lambda-artifacts-x86_64
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      - name: Print DT URLs
        run: |
          echo "DT_TENANT_URL=${DT_TENANT_URL}"
          echo "DT_TENANT_PLATFORM_URL=${DT_TENANT_PLATFORM_URL}"
      - name: Deploy forwarder
        run: ./tests/e2e/deploy_forwarder.sh layer x86_64
      - name: Create test log file
        run: echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E default flow validation log entry" > test.log
      - name: Test EventBridge notification
        run: |
          aws s3api put-bucket-notification-configuration \
            --bucket ${E2E_TESTING_BUCKET_NAME} \
            --notification-configuration '{"EventBridgeConfiguration":{}}'
          sleep 15
          aws s3 cp test.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/test.log
          sleep 180
          ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/test.log
      - name: Clean up notifications
        if: always()
        run: |
          aws s3api put-bucket-notification-configuration \
            --bucket ${E2E_TESTING_BUCKET_NAME} \
            --notification-configuration '{}' || true
      - name: Clean up resources
        if: always()
        run: ./tests/e2e/clean_up_resources.sh
