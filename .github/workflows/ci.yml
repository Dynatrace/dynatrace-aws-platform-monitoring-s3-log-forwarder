# Required GitHub Actions secrets:
#   AWS_CICD_ROLE_ARN            - IAM role ARN for OIDC authentication
#   CFN_ROLE_ARN                 - IAM role ARN passed to CloudFormation deploy for E2E tests
#   DT_TENANT_PLATFORM_TOKEN     - Dynatrace platform token used to create the SSM parameter during E2E deployment
#   DT_TENANT_PLATFORM_URL       - Dynatrace platform URL for log validation queries
#   DT_SSO_URL                   - Dynatrace SSO URL for OAuth token exchange
#   DT_OAUTH_CLIENT_ID           - OAuth client ID for log validation
#   DT_OAUTH_CLIENT_SECRET       - OAuth client secret for log validation
---
name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-cfn-templates:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Validate CloudFormation templates
        run: |
          aws cloudformation validate-template --template-body file://template.yaml
          aws cloudformation validate-template --template-body file://cloudwatch-monitoring-dashboard.yaml
          aws cloudformation validate-template --template-body file://dynatrace-aws-s3-log-forwarder-layer.yaml
          aws cloudformation validate-template --template-body file://dynatrace-aws-s3-log-forwarder-s3-bucket-configuration.yaml
          aws cloudformation validate-template --template-body file://eventbridge-cross-region-or-account-forward-rules.yaml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - name: Run unit tests
        run: |
          cd src && env $(grep -v '^#' ../tests/unit/unit_test.env | xargs) \
            python -m unittest discover -s ../tests -b

  build-x86_64:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6
      - name: Update version
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda ZIP
        run: ./scripts/build_docker.sh zip dist/lambda.zip x86_64
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer.zip x86_64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts-x86_64
          path: |
            dist/lambda.zip
            dist/layer.zip
          retention-days: 7

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6
      - name: Update version
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./scripts/update_version.sh
      - name: Build Lambda ZIP
        run: ./scripts/build_docker.sh zip dist/lambda.zip arm64
      - name: Build Lambda Layer
        run: ./scripts/build_docker.sh layer dist/layer.zip arm64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts-arm64
          path: |
            dist/lambda.zip
            dist/layer.zip
          retention-days: 7

  e2e-test-x86_64:
    name: End-to-end deployment test (${{ matrix.deploy_type }}, ${{ matrix.notification_type }}, x86_64)
    runs-on: ubuntu-latest
    needs: [unit-tests, build-x86_64, build-arm64]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        deploy_type: [zip, layer]
        notification_type: [eventbridge, sns, sqs]
        include:
          - deploy_type: zip
            notification_type: eventbridge
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-eventbridge
          - deploy_type: zip
            notification_type: sns
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-sns-fan-out
          - deploy_type: zip
            notification_type: sqs
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-direct-sqs
          - deploy_type: layer
            notification_type: eventbridge
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-eventbridge
          - deploy_type: layer
            notification_type: sns
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-sns-fan-out
          - deploy_type: layer
            notification_type: sqs
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-direct-sqs
    env:
      NOTIFICATION_TYPE: ${{ matrix.notification_type }}
      E2E_TESTING_BUCKET_NAME: ${{ matrix.bucket }}
      CI_RUN_ID: ${{ github.run_id }}
      DT_TENANT_PLATFORM_TOKEN: ${{ secrets.DT_TENANT_PLATFORM_TOKEN }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - name: Set stack name and test prefix
        run: |
          DEPLOY_SHORT=$([[ "${{ matrix.deploy_type }}" == "layer" ]] && echo "lyr" || echo "zip")
          NOTIFICATION_SUFFIX=$([[ "${{ matrix.notification_type }}" == "eventbridge" ]] && echo "" || echo "-${{ matrix.notification_type }}")
          echo "STACK_NAME=e2e-dt-aws-s3-log-forwarder-${DEPLOY_SHORT}${NOTIFICATION_SUFFIX}-${{ github.run_id }}" >> $GITHUB_ENV
          echo "E2E_TEST_PREFIX=test/${{ github.run_id }}/${{ matrix.deploy_type }}/${{ matrix.notification_type }}/x86_64" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: lambda-artifacts-x86_64
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      - name: Deploy forwarder
        run: ./tests/e2e/deploy_forwarder.sh ${{ matrix.deploy_type }} ${{ matrix.notification_type }} x86_64
      - name: Write test log to S3 and wait for ingestion
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E testing validation log entry" > ${{ github.run_id }}.log
          aws s3 cp ${{ github.run_id }}.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/test_log.log
          sleep 180
      - name: Validate log entry exists in Dynatrace
        run: ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/test_log.log
      - name: Clean up resources
        if: always()
        run: ./tests/e2e/clean_up_resources.sh

  e2e-test-arm64:
    name: End-to-end deployment test (${{ matrix.deploy_type }}, ${{ matrix.notification_type }}, arm64)
    runs-on: ubuntu-24.04-arm
    needs: [unit-tests, build-x86_64, build-arm64, e2e-test-x86_64]
    if: >-
      needs.build-arm64.result == 'success' && needs.e2e-test-x86_64.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        deploy_type: [zip, layer]
        notification_type: [eventbridge, sns, sqs]
        include:
          - deploy_type: zip
            notification_type: eventbridge
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-eventbridge
          - deploy_type: zip
            notification_type: sns
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-sns-fan-out
          - deploy_type: zip
            notification_type: sqs
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-zip-direct-sqs
          - deploy_type: layer
            notification_type: eventbridge
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-eventbridge
          - deploy_type: layer
            notification_type: sns
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-sns-fan-out
          - deploy_type: layer
            notification_type: sqs
            bucket: dynatrace-aws-s3-log-forwarder-e2e-testing-layer-direct-sqs
    env:
      NOTIFICATION_TYPE: ${{ matrix.notification_type }}
      E2E_TESTING_BUCKET_NAME: ${{ matrix.bucket }}
      CI_RUN_ID: ${{ github.run_id }}
      DT_TENANT_PLATFORM_TOKEN: ${{ secrets.DT_TENANT_PLATFORM_TOKEN }}
      CFN_ROLE_ARN: ${{ secrets.CFN_ROLE_ARN }}
      DT_TENANT_PLATFORM_URL: ${{ secrets.DT_TENANT_PLATFORM_URL }}
      DT_SSO_URL: ${{ secrets.DT_SSO_URL }}
      DT_OAUTH_CLIENT_ID: ${{ secrets.DT_OAUTH_CLIENT_ID }}
      DT_OAUTH_CLIENT_SECRET: ${{ secrets.DT_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - name: Set stack name and test prefix
        run: |
          DEPLOY_SHORT=$([[ "${{ matrix.deploy_type }}" == "layer" ]] && echo "lyr" || echo "zip")
          NOTIFICATION_SUFFIX=$([[ "${{ matrix.notification_type }}" == "eventbridge" ]] && echo "" || echo "-${{ matrix.notification_type }}")
          echo "STACK_NAME=e2e-dt-aws-s3-log-forwarder-${DEPLOY_SHORT}${NOTIFICATION_SUFFIX}-${{ github.run_id }}" >> $GITHUB_ENV
          echo "E2E_TEST_PREFIX=test/${{ github.run_id }}/${{ matrix.deploy_type }}/${{ matrix.notification_type }}/arm64" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: lambda-artifacts-arm64
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests
      - name: Deploy forwarder
        run: ./tests/e2e/deploy_forwarder.sh ${{ matrix.deploy_type }} ${{ matrix.notification_type }} arm64
      - name: Write test log to S3 and wait for ingestion
        run: |
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] E2E testing validation log entry" > ${{ github.run_id }}.log
          aws s3 cp ${{ github.run_id }}.log s3://${E2E_TESTING_BUCKET_NAME}/${E2E_TEST_PREFIX}/test_log.log
          sleep 180
      - name: Validate log entry exists in Dynatrace
        run: ./tests/e2e/validate_logs_exist.py --bucket ${E2E_TESTING_BUCKET_NAME} --key ${E2E_TEST_PREFIX}/test_log.log
      - name: Clean up resources
        if: always()
        run: ./tests/e2e/clean_up_resources.sh
